<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1140" font-family="Tahoma, Arial" viewBox="0 0 1560 1140">
<defs>
 <style>
  .t{fill:#111;font-size:14px}.ts{fill:#333;font-size:11px}.tt{fill:#063a9c;font-size:15px;font-weight:bold}
  .pw{stroke:#c0392b;stroke-width:1.6;fill:none}.lg{stroke:#1a5f2a;stroke-width:1.4;fill:none}
  .w{stroke:#222;stroke-width:1.2;fill:none}.box{stroke:#222;stroke-width:1.4;fill:#fff}
  .zone{stroke:#888;stroke-width:1;fill:none;stroke-dasharray:5 3}
  .warn{fill:#7a1d1d;font-size:11px}.node{fill:#c0392b}.gnd{stroke:#1a5f2a;stroke-width:1.4;fill:#1a5f2a}
 </style>
</defs>
<rect width="100%" height="100%" fill="#fbfcfd"/>
<text x="780" y="30" text-anchor="middle" class="tt">Esp32 IX4 Relay Board — شماتیک بازسازی از روی عکس‌های سازنده (iranicboard.ir)</text>
<text x="780" y="50" text-anchor="middle" class="ts">Reconstructed schematic • نگاشت رله‌ها به‌صورت قطعی از روی سیلک PCB: RELAY1→GPIO4 ، RELAY2→GPIO2 ، RELAY3→GPIO13 ، RELAY4→GPIO12</text>

<!-- ================= POWER ================= -->
<rect x="30" y="70" width="500" height="470" class="zone"/>
<text x="40" y="90" class="tt">۱) ساختمان تغذیه</text>
<rect x="50" y="120" width="90" height="56" class="box"/><text x="95" y="145" text-anchor="middle" class="t">جک DC005</text><text x="95" y="163" text-anchor="middle" class="ts">12V ≥1A</text>
<path class="pw" d="M140 148 H185"/>
<rect x="185" y="132" width="80" height="32" class="box"/><text x="225" y="152" text-anchor="middle" class="ts">D1 SS34/SR540؟</text>
<path class="pw" d="M265 148 H300"/>
<rect x="300" y="115" width="180" height="130" class="box"/><text x="390" y="135" text-anchor="middle" class="t">U1 LM2596-5.0 (باک)</text>
<text x="390" y="152" text-anchor="middle" class="ts">IN: PIN5 → 12V</text>
<text x="390" y="168" text-anchor="middle" class="ts">OUT: PIN2 ←→ L1 سلف بزرگ</text>
<text x="390" y="184" text-anchor="middle" class="ts">FB: PIN4 — GND: PIN3 — ON/OFF: PIN1</text>
<path class="pw" d="M480 180 H520"/>
<rect x="520" y="150" width="70" height="60" class="box"/><text x="555" y="178" text-anchor="middle" class="ts">L1 درام‌کور ≈47–100µH</text>
<path class="pw" d="M590 180 H640"/>
<circle cx="640" cy="180" r="3" class="node"/><text x="630" y="172" text-anchor="middle" class="t" fill="#c0392b">+5V</text>
<path class="pw" d="M640 180 V148 H480"/>
<rect x="486" y="120" width="28" height="22" class="box"/><text x="500" y="115" text-anchor="middle" class="ts">Cin=470µF/35V</text>
<path class="pw" d="M500 120 V110 H430"/>
<text x="410" y="205" class="ts">سلف دوم روی عکس وجود دارد — مسیر دقیقش باید روی نمونه فیزیکی چک شود (خط‌چین)</text>
<rect x="300" y="260" width="120" height="50" class="zone"/><text x="360" y="281" text-anchor="middle" class="ts">L2 سلف دوم؟</text><text x="360" y="298" text-anchor="middle" class="ts">فیلتر ورودی/باک دوم</text>

<!-- 5V → 3.3V -->
<path class="pw" d="M290 180 V330 H355"/>
<rect x="355" y="300" width="190" height="90" class="box"/><text x="450" y="322" text-anchor="middle" class="t">U2 AMS1117-3.3</text>
<text x="450" y="340" text-anchor="middle" class="ts">IN=+5V ↑ خازن 22µF / OUT=+3V3 ↓ خازن 22µF</text>
<path class="pw" d="M545 345 H620"/>
<circle cx="640" cy="345" r="3" class="node"/><text x="630" y="337" text-anchor="middle" class="t" fill="#c0392b">+3V3</text>
<rect x="50" y="300" width="90" height="46" class="box"/><text x="95" y="322" text-anchor="middle" class="ts">LED PWR + R</text>
<path class="pw" d="M95 300 V265 H150"/><path class="pw" d="M150 265 H140"/>
<path class="lg" d="M95 346 V390 h-24"/><path class="gnd" d="M65 390 h12 M68 394 h6 M70.5 398 l1.5 4 1.5-4"/>
<text x="50" y="420" class="warn">رله‌ها از +12V تغذیه می‌شوند (بوبین ۱۲V)؛ USB به‌تنهایی رله روشن نمی‌کند.</text>

<!-- ================= USB / CH340 ================= -->
<rect x="560" y="70" width="470" height="300" class="zone"/>
<text x="570" y="90" class="tt">۲) USB↔UART و پروگرام</text>
<rect x="580" y="110" width="100" height="56" class="box"/><text x="630" y="135" text-anchor="middle" class="t">Micro USB</text><text x="630" y="153" text-anchor="middle" class="ts">D+ D− ←→ U3</text>
<rect x="720" y="110" width="200" height="160" class="box"/><text x="820" y="132" text-anchor="middle" class="t">U3 CH340G (SOIC-16)</text>
<text x="820" y="150" text-anchor="middle" class="ts">UD+ UD− : پین ۵،۶</text>
<text x="820" y="166" text-anchor="middle" class="ts">TXD(۲) → RXD0(GPIO3)</text>
<text x="820" y="182" text-anchor="middle" class="ts">RXD(۳) ← TXD0(GPIO1)</text>
<text x="820" y="198" text-anchor="middle" class="ts">DTR(۱۴) → Q5 → IO0</text>
<text x="820" y="214" text-anchor="middle" class="ts">RTS(۱۳) → Q6 → EN</text>
<text x="820" y="230" text-anchor="middle" class="ts">LEDم دار: R۱۰k + LED TX/RX ⚫</text>
<text x="820" y="246" text-anchor="middle" class="ts">+5V = VCC؛ XI/XO → X1 12MHz + 2×22pF</text>
<rect x="950" y="120" width="70" height="40" class="box"/><text x="985" y="140" text-anchor="middle" class="ts">X1 HC-49 ‏12MHz</text>
<path class="w" d="M950 140 H920"/>
<rect x="720" y="290" width="200" height="60" class="zone"/>
<text x="820" y="310" text-anchor="middle" class="ts">R11/R12/R13/R14 ~4.7Ω? — جفت‌قلابون USB</text>
<text x="820" y="330" text-anchor="middle" class="ts">(مقادیر SMD از روی عکس قطعی نیست)</text>

<!-- ================= ESP32 MODULE ================= -->
<rect x="570" y="400" width="440" height="620" class="zone"/>
<text x="580" y="422" class="tt">۳) ماژول ESP-WROOM-32</text>
<rect x="650" y="450" width="280" height="470" class="box" fill="#f5f7fa"/>
<text x="790" y="474" text-anchor="middle" class="t">ESP-WROOM-32 (ESP32-D0WDQ6)</text>
<text x="790" y="490" text-anchor="middle" class="ts">Flash 4MB • WiFi+BT • آنتن meander جنوبی</text>
<!-- left pins -->
<g class="ts" text-anchor="end">
<path class="w" d="M650 510 H600"/><text x="598" y="514">EN ← R9 10k↑ + C3 1µF + کلید RESET</text>
<path class="w" d="M650 530 H600"/><text x="598" y="534">GPIO1 TXD0 → از CH340</text>
<path class="w" d="M650 550 H600"/><text x="598" y="554">GPIO3 RXD0 → به CH340</text>
<path class="w" d="M650 570 H600"/><text x="598" y="574">GPIO21/22 I2C آزاد → هدر</text>
<path class="w" d="M650 590 H600"/><text x="598" y="594">GPIO16/17 UART2 آزاد</text>
<path class="w" d="M650 610 H600"/><text x="598" y="614">34/35/36/39 فقط ورودی</text>
<path class="w" d="M650 630 H600"/><text x="598" y="634">25/26 DAC • 27/32/33 آزاد</text>
<path class="lg" d="M650 655 H608"/><path class="gnd" d="M602 655 h12 M605 659 h6 M607.5 663 l1.5 4 1.5-4"/><text x="585" y="659">GND</text>
<path class="pw" d="M650 680 H600"/><text x="598" y="684" fill="#c0392b">3V3 ← از U2</text>
</g>
<!-- right pins -->
<g class="ts">
<path class="w" d="M930 510 H975"/><text x="980" y="514">GPIO5 VSPI_CS → هدر</text>
<path class="w" d="M930 530 H975"/><text x="980" y="534">GPIO18/19/23 VSPI → هدر</text>
<path class="w" d="M930 550 H975"/><text x="980" y="554">GPIO14/15 آزاد (استرپینگ!)</text>
<path class="w" d="M930 570 H975"/><text x="980" y="574">GPIO6..11 = SPI FLASH ⛔ استفاده ممنوع</text>
<path class="w" d="M930 610 H975"/><text x="980" y="614">GPIO0 ← کلید FLASH + R7 10k↑ + Q5</text>
<path class="w" d="M930 630 H975"/><text x="980" y="634">EN = RESET + R9↑ + Q6</text>
</g>
<!-- relay connections -->
<g class="lg" stroke-width="2.2">
<path d="M930 700 H1010 V760 H1030"/>
<path d="M930 730 H1000 V840 H1030"/>
<path d="M930 760 H1010 V920 H1030"/>
<path d="M930 790 H1000 V1000 H1030"/>
</g>
<text x="975" y="866" class="ts">GPIO4 ← رله۱</text>
<text x="975" y="886" class="ts">GPIO2 ← رله۲</text>
<text x="975" y="906" class="ts">GPIO13 ← رله۳</text>
<text x="975" y="926" class="ts">GPIO12 ← رله۴</text>

<!-- HEADERS -->
<rect x="60" y="560" width="400" height="180" class="zone"/>
<text x="70" y="582" class="tt">هدرهای توسعه (۲ ردیف ۱۶تایی)</text>
<text x="70" y="608" class="ts">همه GPIOهای سالم ماژول روی هدرهای کناری تکرار می‌شوند: I2C: 21/22 • SPI: 18/19/23/5 • UART2: 16/17 •</text>
<text x="70" y="628" class="ts">همچنین 3V3/5V/GND — مناسب سنسور DHT/DS18B20/PIR/LCD I2C/نمایشگر…</text>
<text x="70" y="648" class="ts">GPIOهای اشغالی رله (2/4/12/13) و بوت (0/2/12/15) را با احتیاط توسعه بدهید.</text>
<text x="70" y="668" class="ts">ADC با WiFi ← فقط ADC1 (GPIO32..39)</text>
<rect x="70" y="680" width="180" height="45" class="box"/><text x="160" y="700" text-anchor="middle" class="ts">هدر چپ (16پین)</text>
<rect x="280" y="680" width="168" height="45" class="box"/><text x="364" y="700" text-anchor="middle" class="ts">هدر راست (16پین)</text>

<!-- ================= 4 RELAY CHANNELS ================= -->
<rect x="1060" y="70" width="470" height="1050" class="zone"/>
<text x="1070" y="90" class="tt">۴) چهار کانال رله</text>
<!-- channel template -->
<g>
<rect x="1060" y="700" width="30" height="16" class="lg"/>
<text x="1040" y="714" text-anchor="end" class="t">GPIO4</text>
<path class="lg" stroke-width="2.2" d="M1040 706 H1060"/>
<path class="lg" stroke-width="2" d="M1090 708 H1130"/>
<rect x="1130" y="690" width="315" height="410" class="box"/>
<text x="1287" y="712" text-anchor="middle" class="t">کانال رله (×۴ یکسان)</text>
<rect x="1150" y="730" width="86" height="34" class="box"/><text x="1193" y="751" text-anchor="middle" class="ts">R بیس 1k</text>
<path class="w" d="M1130 747 H1150"/>
<path class="w" d="M1236 747 H1260"/>
<rect x="1260" y="725" width="86" height="46" class="box"/><text x="1303" y="747" text-anchor="middle" class="ts">S8050 (NPN)</text><text x="1303" y="763" text-anchor="middle" class="ts">GND → E</text>
<path class="lg" d="M1346 755 V810"/>
<path class="gnd" d="M1340 810 h12 M1343 814 h6 M1345.5 818 l1.5 4 1.5-4"/>
<rect x="1260" y="840" width="168" height="120" class="box" fill="#eef2ff"/>
<text x="1344" y="862" text-anchor="middle" class="t">K1 رله JQC-3F(T73)-DC12V</text>
<text x="1344" y="880" text-anchor="middle" class="ts">کویل: +12V ↔ کالکتور Q1</text>
<text x="1344" y="898" text-anchor="middle" class="ts">D فلای‌بک 1N4148 موازی کویل</text>
<text x="1344" y="916" text-anchor="middle" class="ts">LED کانال + R 1k روی سمت کویل</text>
<text x="1344" y="934" text-anchor="middle" class="ts">کنتاکت: COM(وسط)/NO/NC</text>
<path class="pw" d="M1344 970 V1005 H1444"/>
<path class="pw" d="M1460 840 H1428"/><rect x="1288" y="818" width="40" height="18" class="pw"/>
<text x="1308" y="810" text-anchor="middle" class="t" fill="#c0392b">+12V</text>
<path class="w" d="M1444 970 V760"/>
<rect x="1430" y="720" width="90" height="80" class="box"/>
<text x="1475" y="745" text-anchor="middle" class="t">KF301-3P</text>
<text x="1475" y="765" text-anchor="middle" class="ts">NC | COM | NO</text>
<text x="1475" y="785" text-anchor="middle" class="warn">ترتیب NC/NO ← سیلک چک شود</text>
</g>
<!-- map table -->
<rect x="1080" y="130" width="430" height="150" class="box" fill="#f4f8ff"/>
<text x="1295" y="152" text-anchor="middle" class="tt">نگاشت قطعی از سیلک PCB</text>
<text x="1100" y="176" class="t">RELAY1 → GPIO4 (D04)      RELAY2 → GPIO2 (D02)</text>
<text x="1100" y="198" class="t">RELAY3 → GPIO13 (D13)      RELAY4 → GPIO12 (D12)</text>
<text x="1100" y="224" class="warn">⚠ GPIO2 و GPIO12 استرپینگ بوت ESP32اند — در بوت رله نباید prank ورودی را بالا نگه دارد؛</text>
<text x="1100" y="242" class="warn">درایور NPN این مسأله را عملاً حل می‌کند ولی در توسعه جانبی توجه کنید.</text>
<!-- switch drivers summary -->
<rect x="1080" y="300" width="430" height="180" class="zone"/>
<text x="1090" y="322" class="tt">LEDها و کلیدها</text>
<text x="1090" y="348" class="ts">• LED هر رله: روی خط درایور همان کانال (موازی کویل، ~R1k)</text>
<text x="1090" y="370" class="ts">• LED PWR روی +5V یا +12V (از عکس: پایین-چپ، کنار جک)</text>
<text x="1090" y="392" class="ts">• LEDهای RX/TX: از خروجی‌های نشانگر CH340 با R 10k</text>
<text x="1090" y="414" class="ts">• کلید FLASH: GPIO0↔GND + R10k پول‌آپ</text>
<text x="1090" y="436" class="ts">• کلید RESET: EN↔GND + R10k پول‌آپ + C 1µF</text>
<text x="1090" y="458" class="ts">کلید FLASH/RESET در لبه بالایی برد هستند (مارکرهای ۱/۲ رسمی)</text>
<rect x="1080" y="500" width="430" height="120" class="zone"/>
<text x="1090" y="522" class="tt">منبع تغذیه بار</text>
<text x="1090" y="548" class="ts">کوانتیتی: 4 بوبین × ~40mA (JQC-3F ‏۱۲V) + ESP32 ≤ 500mA ← منبع پیشنهادی 12V/1A+</text>
<text x="1090" y="570" class="ts">⛔ 24V مستقیم مجاز نیست (تأیید رسمی پشتیبانی) ← مبدل 24→12 لازم</text>
<text x="1090" y="592" class="ts">⚠ رتبه رله 7A@220VAC برای بار مقاومتی است؛ القایی = جرقه/derating</text>
</svg>
